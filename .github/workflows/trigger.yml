# The clock for the page's worker. Scheduled runs never fire in the private repo
# rafayfromfast/manno-page (GitHub Free), so this public repo keeps the schedule and starts
# a worker run there through the API. It does nothing else and sees no other key.
# Times are UTC; PKT = UTC+5.

name: Start the worker

on:
  schedule:
    - cron: "12,32,52 13-18 * * *"   # every 20 minutes, 18:12 to 23:52 PKT (around posting time)
    - cron: "17 2-12 * * *"         # hourly, 07:17 to 17:17 PKT
    - cron: "3 5 * * 6"             # Saturdays 10:03 PKT: plan next week, then the usual run
    - cron: "*/10 21-23 * * *"      # TEMPORARY 2026-11-13: proves schedules fire here; remove after
  workflow_dispatch:

permissions: {}

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start a worker run in manno-page
        env:
          GH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "WORKER_DISPATCH_TOKEN is not set yet; nothing started"; exit 0; fi
          job=cycle
          if [ "$SCHEDULE" = "3 5 * * 6" ]; then job=weekly; fi
          # The REST call needs only the token's Actions permission (`gh workflow run` also reads the repo).
          gh api --method POST repos/rafayfromfast/manno-page/actions/workflows/jobs.yml/dispatches \
            -f ref=main -f "inputs[job]=$job" --silent
          echo "started a $job run"
